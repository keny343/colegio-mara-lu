<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1406"/>
      <stop offset="45%" stop-color="#4A2712"/>
      <stop offset="100%" stop-color="#E8641A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.7" y1="0.1" x2="0.2" y2="0.9">
      <stop offset="0%" stop-color="#F28340" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#E8641A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3D1F0A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6D3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F5E6D3" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="1280" cy="180" rx="420" ry="280" fill="url(#glow)" filter="url(#soft)"/>
  <!-- architectural rhythm: vertical mullions -->
  <g opacity="0.18" stroke="#F5E6D3" stroke-width="1.5">
    <line x1="980" y1="0" x2="980" y2="900"/>
    <line x1="1120" y1="0" x2="1120" y2="900"/>
    <line x1="1260" y1="0" x2="1260" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
    <line x1="1540" y1="0" x2="1540" y2="900"/>
    <line x1="900" y1="220" x2="1600" y2="220"/>
    <line x1="900" y1="460" x2="1600" y2="460"/>
    <line x1="900" y1="700" x2="1600" y2="700"/>
  </g>
  <!-- light panes -->
  <g fill="url(#glass)">
    <rect x="1000" y="80" width="100" height="110" rx="2"/>
    <rect x="1140" y="80" width="100" height="110" rx="2"/>
    <rect x="1280" y="80" width="100" height="110" rx="2"/>
    <rect x="1000" y="280" width="100" height="140" rx="2"/>
    <rect x="1140" y="280" width="100" height="140" rx="2"/>
    <rect x="1280" y="280" width="100" height="140" rx="2"/>
  </g>
  <!-- foreground ground plane -->
  <path d="M0 720 C420 640 780 780 1600 620 L1600 900 L0 900 Z" fill="#1F1005" opacity="0.55"/>
  <path d="M0 780 C380 720 820 820 1600 700 L1600 900 L0 900 Z" fill="#140A04" opacity="0.65"/>
  <!-- grain -->
  <g opacity="0.07">
    <circle cx="120" cy="140" r="1.2" fill="#F5E6D3"/>
    <circle cx="240" cy="320" r="1" fill="#F5E6D3"/>
    <circle cx="420" cy="90" r="1.4" fill="#F5E6D3"/>
    <circle cx="560" cy="480" r="1" fill="#F5E6D3"/>
    <circle cx="700" cy="210" r="1.2" fill="#F5E6D3"/>
    <circle cx="880" cy="560" r="1" fill="#F5E6D3"/>
    <circle cx="1040" cy="400" r="1.3" fill="#F5E6D3"/>
    <circle cx="1320" cy="640" r="1" fill="#F5E6D3"/>
  </g>
</svg>
